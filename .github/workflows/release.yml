name: Release

on:
  push:
    branches:
      - main

# 防止并发冲突
concurrency: ${{ github.workflow }}-${{ github.ref }}

# 🔒 权限配置：必须有写权限才能创建 PR 和更新版本号
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # 保留远端已有的 annotated tag，避免发布后创建同名的新 tag 并推送失败。
          fetch-depth: 0

      # 2. 安装与 package.json 一致的 pnpm 版本
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # 3. 配置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 必须指定 registry-url，否则无法读取 NODE_AUTH_TOKEN
          registry-url: 'https://registry.npmjs.org'
          # 开启缓存，加速安装
          cache: 'pnpm'

      # 4. 安装依赖 (使用 pnpm)
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. Changesets 核心步骤
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # --- 发布命令 ---
          # 必须使用 pnpm run release，因为项目里有 pnpm-lock.yaml
          publish: pnpm run release

          # --- PR 信息 ---
          commit: 'chore: update versions'
          title: 'chore: update versions'
        env:
          # GitHub 自动生成的 Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 你在 Secrets 里配置的 NPM Token (必须叫 NPM_TOKEN 或 NODE_AUTH_TOKEN)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
